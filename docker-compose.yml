services:
  # 1. Base de données PostgreSQL (Isolée sur backend-net)
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # 2. Backend Express (Fait la liaison entre Nginx et la BDD)
  backend:
    build: ./back
    container_name: backend
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  # 3. Frontend React (Isolé sur frontend-net)
  frontend:
    build: ./front
    container_name: frontend
    restart: always
    networks:
      - frontend-net

  # 4. Reverse Proxy Nginx (Passerelle / DMZ rattachée aux deux réseaux)
  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
      - backend-net

# Persistance des données PostgreSQL
volumes:
  pgdata:

# Déclaration des deux réseaux internes distincts
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
