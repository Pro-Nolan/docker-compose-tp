server {
    listen 80;
    server_name localhost;

    # Redirection de la racine / vers le service frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirection des routes API vers le service backend
    location /api1 {
        proxy_pass http://backend:3000/api1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api2 {
        proxy_pass http://backend:3000/api2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
